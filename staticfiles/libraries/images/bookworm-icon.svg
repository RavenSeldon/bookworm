<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Bookworm Navbar Icon — simplified brand mark -->
  <!-- Matches the illustrated mascot: green worm with glasses reading a book -->

  <!-- Body curve (worm) -->
  <path d="M14 38c-2-3-3-7-1-11 1.5-3 4-5.5 7-6.5" 
        fill="none" stroke="#228264" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Head -->
  <circle cx="24" cy="18" r="10" fill="#34b88f"/>
  <circle cx="24" cy="18" r="10" fill="url(#headGrad)"/>

  <!-- Head gradient for depth -->
  <defs>
    <radialGradient id="headGrad" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#5fc9a7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#228264" stop-opacity="0.3"/>
    </radialGradient>
  </defs>

  <!-- Glasses frames -->
  <circle cx="20" cy="17" r="4.2" fill="none" stroke="#0d3028" stroke-width="1.8"/>
  <circle cx="28" cy="17" r="4.2" fill="none" stroke="#0d3028" stroke-width="1.8"/>
  <!-- Bridge -->
  <path d="M24.2 17c0-1.8-1.5-1.8-3-1.2" fill="none" stroke="#0d3028" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Temple arms -->
  <path d="M15.8 16.5 13 14.5" fill="none" stroke="#0d3028" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M32.2 16.5 35 14.5" fill="none" stroke="#0d3028" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Eyes (behind glasses) -->
  <circle cx="20" cy="16.8" r="1.6" fill="#0d3028"/>
  <circle cx="28" cy="16.8" r="1.6" fill="#0d3028"/>
  <!-- Eye shine -->
  <circle cx="20.6" cy="16.2" r="0.6" fill="white"/>
  <circle cx="28.6" cy="16.2" r="0.6" fill="white"/>

  <!-- Smile -->
  <path d="M21 22c1.2 1.2 3.8 1.2 5 0" fill="none" stroke="#0d3028" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Book -->
  <rect x="28" y="28" width="12" height="9" rx="1" fill="#d97706" transform="rotate(-12 34 32.5)"/>
  <line x1="29.5" y1="28.8" x2="31.5" y2="36.5" stroke="#fbbf24" stroke-width="0.8"/>
  <!-- Pages -->
  <rect x="29" y="28.5" width="5.5" height="8" rx="0.5" fill="#fef3c7" transform="rotate(-12 31.75 32.5)"/>

  <!-- Cheek blush -->
  <circle cx="16.5" cy="20" r="1.8" fill="#f59e0b" opacity="0.25"/>
  <circle cx="31.5" cy="20" r="1.8" fill="#f59e0b" opacity="0.25"/>
</svg>
