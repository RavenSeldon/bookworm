# =============================================================================
# Bookworm: Nixpacks Configuration for Railway
# =============================================================================
# Railway uses Nixpacks to build. GeoDjango requires system-level
# geospatial libraries (GDAL, GEOS, PROJ) that aren't in pip.
# =============================================================================

[phases.setup]
aptPkgs = ["gdal-bin", "libgdal-dev", "libgeos-dev", "libproj-dev"]

[phases.build]
cmds = ["pip install -r requirements.txt"]
